
name: CI

on:
  push:
    branches:
      - main
      - week-7-review-agents
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Garnet Runtime Review
        uses: garnet-org/action@f9ed14ab54564073ec11bba8d62d6980e172d2a0
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          debug: "true"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Emit Prisma contract
        run: npx prisma contract emit

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build

  test:
    name: Test (${{ matrix.test_type }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_type:
          - vitest
          - playwright

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Garnet Runtime Review
        uses: garnet-org/action@f9ed14ab54564073ec11bba8d62d6980e172d2a0
        with:
          api_token: ${{ secrets.GARNET_API_TOKEN }}
          debug: "true"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Emit Prisma contract
        run: npx prisma contract emit

      - name: Install Playwright browsers
        if: matrix.test_type == 'playwright'
        run: npx playwright install --with-deps

      - name: Run Vitest
        if: matrix.test_type == 'vitest'
        run: npx vitest run

      - name: Run Playwright
        if: matrix.test_type == 'playwright'
        run: npx playwright test
